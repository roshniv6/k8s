apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default-strict-Mtls
  namespace: production
spec:
  mtls:
    mode: STRICT
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: payment-service-router
  namespace: production
spec:
  hosts:
    - payment-service 
  route:
    - destination:
        host: payment-service
        port:
          number: 8080
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: payment-service-destination
  namespace: production
spec:
  host: payment-service
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
