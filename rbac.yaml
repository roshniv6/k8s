apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-deployer
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role  
metadata:
  name: deploy-manager
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["deployments", "replicasets", "pods"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding 
metadata:
  name: app-deployer-binding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: app-deployer
    namespace: production 
    roleRef:
      kind: Role
      name: deploy-manager
      apiGroup: rbac.authorization.k8s.io